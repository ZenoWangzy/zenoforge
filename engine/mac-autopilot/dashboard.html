<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the product 流水线看板</title>
<style>
  /* 设计令牌：取自 DESIGN.md（冷灰底、单一 navy 强调色、语义色只表状态）；深色是同一套角色的深色取值，不是自动反色。 */
  :root {
    color-scheme: light;
    --canvas:#f7f9fb; --surface:#ffffff; --soft:#f8fafc; --sunk:#f1f5f9;
    --hairline:#e2e8f0; --hairline-soft:#eef2f6; --hairline-strong:#cbd5e1;
    --ink:#0f172a; --charcoal:#1e293b; --body:#475569; --steel:#64748b; --stone:#94a3b8;
    --primary:#1a237e; --primary-subtle:#e8eaf6; --on-primary:#ffffff;
    --ok:#1aae39; --warn:#dd5b00; --bad:#e03131; --none:#94a3b8;
    --ok-ink:#12802a; --warn-ink:#b34a00; --bad-ink:#c92a2a; --none-ink:#64748b;
    --ok-bg:#d9f3e1; --warn-bg:#ffe8d4; --bad-bg:#fde0ec; --none-bg:#f1f5f9;
    --ok-zone:rgba(26,174,57,.18); --warn-zone:rgba(221,91,0,.16); --bad-zone:rgba(224,49,49,.15);
    --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
    --link:#0066cc;
    --font:"Manrope","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --canvas:#0e121a; --surface:#151b26; --soft:#18202c; --sunk:#1f2836;
      --hairline:#263142; --hairline-soft:#1e2734; --hairline-strong:#34415a;
      --ink:#eef2f7; --charcoal:#dbe2ec; --body:#b3bfcf; --steel:#8d9ab0; --stone:#66748b;
      --primary:#9fa8f0; --primary-subtle:#232a4f; --on-primary:#0e121a;
      --ok:#3cc45e; --warn:#f08c3c; --bad:#f06464; --none:#66748b;
      --ok-ink:#5fd67c; --warn-ink:#f5a15e; --bad-ink:#f78585; --none-ink:#8d9ab0;
      --ok-bg:rgba(60,196,94,.16); --warn-bg:rgba(240,140,60,.16); --bad-bg:rgba(240,100,100,.16); --none-bg:#1f2836;
      --ok-zone:rgba(60,196,94,.16); --warn-zone:rgba(240,140,60,.16); --bad-zone:rgba(240,100,100,.17);
      --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
      --link:#7fb4ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas:#0e121a; --surface:#151b26; --soft:#18202c; --sunk:#1f2836;
    --hairline:#263142; --hairline-soft:#1e2734; --hairline-strong:#34415a;
    --ink:#eef2f7; --charcoal:#dbe2ec; --body:#b3bfcf; --steel:#8d9ab0; --stone:#66748b;
    --primary:#9fa8f0; --primary-subtle:#232a4f; --on-primary:#0e121a;
    --ok:#3cc45e; --warn:#f08c3c; --bad:#f06464; --none:#66748b;
    --ok-ink:#5fd67c; --warn-ink:#f5a15e; --bad-ink:#f78585; --none-ink:#8d9ab0;
    --ok-bg:rgba(60,196,94,.16); --warn-bg:rgba(240,140,60,.16); --bad-bg:rgba(240,100,100,.16); --none-bg:#1f2836;
    --ok-zone:rgba(60,196,94,.16); --warn-zone:rgba(240,140,60,.16); --bad-zone:rgba(240,100,100,.17);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
    --link:#7fb4ff;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--canvas); color:var(--body); }
  body { font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  code, .mono { font-family:var(--mono); font-size:12px; }
  b, strong { color:var(--charcoal); font-weight:600; }
  button { font:inherit; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }

  /* ---- 外框：左侧模块栏 + 右侧视图 ---- */
  .app { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
  .side { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; padding:20px 12px; background:var(--surface); border-right:1px solid var(--hairline); }
  .brand { display:flex; align-items:center; gap:10px; padding:0 8px 18px; color:var(--ink); font-weight:600; font-size:15px; letter-spacing:-.2px; }
  .brand .mark { width:22px; height:22px; color:var(--primary); }
  .brand small { color:var(--stone); font-weight:500; font-size:12px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nv { display:flex; align-items:center; gap:10px; width:100%; height:38px; padding:0 10px; border:0; border-radius:8px; background:transparent; color:var(--steel); cursor:pointer; text-align:left; }
  .nv:hover { background:var(--soft); color:var(--charcoal); }
  .nv.on { background:var(--primary-subtle); color:var(--primary); }
  .nv.on .nv-t { font-weight:600; }
  .nv .ic { width:18px; height:18px; flex:none; }
  .nv-t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13.5px; }
  .nv-n { font-size:12px; color:var(--steel); font-variant-numeric:tabular-nums; }
  .nv.on .nv-n { color:var(--primary); }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--none); }
  .dot.s-ok { background:var(--ok); } .dot.s-warn { background:var(--warn); } .dot.s-bad { background:var(--bad); }
  .side-foot { margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--hairline-soft); display:flex; align-items:center; gap:8px; color:var(--stone); font-size:12px; }
  .ghost { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:1px solid var(--hairline); border-radius:6px; background:transparent; color:var(--steel); cursor:pointer; font-size:12px; }
  .ghost:hover { background:var(--soft); color:var(--charcoal); }
  .ghost.on { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
  .ghost[disabled] { opacity:.4; cursor:default; }
  .ghost .ic { width:14px; height:14px; }
  .flip { transform:scaleX(-1); }
  .ic.big { width:20px; height:20px; }

  main { min-width:0; padding:24px 32px 48px; }
  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .top h1 { margin:0; color:var(--ink); font-size:24px; font-weight:600; letter-spacing:-.5px; line-height:1.2; display:flex; align-items:center; gap:10px; }
  .top h1 .ic { width:22px; height:22px; color:var(--primary); }
  .top h1 small { font-size:13px; color:var(--stone); font-weight:500; letter-spacing:0; }
  .fresh { display:inline-flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--steel); }

  /* ---- 面板与网格 ---- */
  .grid { display:grid; gap:16px; }
  .g2 { grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); }
  .g3 { grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); }
  .g4 { grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); }
  .stack16 > * + * { margin-top:16px; }
  .panel { background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:18px 20px; min-width:0; }
  .panel.span2 { grid-column:1 / -1; }
  .masonry { columns:2 420px; column-gap:16px; margin-bottom:-16px; }
  .masonry > .panel { break-inside:avoid; margin:0 0 16px; }
  .stack16 > .masonry + * { margin-top:16px; }
  .ph { display:flex; align-items:center; gap:8px; margin:0 0 14px; color:var(--charcoal); font-size:13.5px; font-weight:600; }
  .ph .ic { width:16px; height:16px; color:var(--steel); }
  .ph .aside { margin-left:auto; font-weight:400; font-size:12px; color:var(--stone); display:flex; align-items:center; gap:8px; }
  .sub { color:var(--stone); font-size:12px; }
  .muted { color:var(--steel); }
  .ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; flex:none; }
  .s-ok { --s:var(--ok); --si:var(--ok-ink); --sb:var(--ok-bg); }
  .s-warn { --s:var(--warn); --si:var(--warn-ink); --sb:var(--warn-bg); }
  .s-bad { --s:var(--bad); --si:var(--bad-ink); --sb:var(--bad-bg); }
  .s-none { --s:var(--none); --si:var(--none-ink); --sb:var(--none-bg); }
  .si { color:var(--si); }
  .chip { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:4px; background:var(--sb, var(--sunk)); color:var(--si, var(--steel)); font-size:12px; font-weight:500; white-space:nowrap; }
  .chip .ic { width:13px; height:13px; }
  .tag { display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:4px; background:var(--sunk); color:var(--steel); font-size:11.5px; white-space:nowrap; }
  .empty { display:flex; align-items:center; gap:8px; color:var(--stone); font-size:13px; padding:6px 0; }
  .unavail { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:8px; background:var(--bad-bg); color:var(--bad-ink); font-size:13px; }
  .unavail .sub { color:inherit; opacity:.8; }

  /* ---- 子弹条：数值 + 健康区 / 警告区 / 不健康区 + 两条界线 ---- */
  .buls { display:grid; gap:14px 28px; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); }
  .bul { min-width:0; cursor:default; }
  .bul-h { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .bul-l { color:var(--body); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bul-v { display:inline-flex; align-items:center; gap:5px; color:var(--si); white-space:nowrap; }
  .bul-v b { color:var(--si); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  .bul-v small { color:var(--stone); font-size:11.5px; }
  .bul-v .ic { width:14px; height:14px; }
  .bul-t { position:relative; height:8px; border-radius:4px; background:var(--sunk); }
  .bul-t .z { position:absolute; top:0; bottom:0; }
  .bul-t .z-ok { background:var(--ok-zone); } .bul-t .z-warn { background:var(--warn-zone); } .bul-t .z-bad { background:var(--bad-zone); }
  .bul-t .z:first-child { border-radius:4px 0 0 4px; } .bul-t .z:last-of-type { border-radius:0 4px 4px 0; }
  .bul-t .f { position:absolute; left:0; top:2px; height:4px; border-radius:2px; background:var(--s); }
  .bul-t .th { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; border-radius:1px; background:var(--ok); }
  .bul-t .th.u { background:var(--bad); }
  .bul-t .ov { position:absolute; right:-2px; top:-3px; width:0; height:0; border-top:7px solid transparent; border-bottom:7px solid transparent; border-left:7px solid var(--s); }
  .bul-b { display:flex; gap:12px; margin-top:5px; font-size:11px; color:var(--stone); font-variant-numeric:tabular-nums; }
  .bul-b i { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:1px; }

  /* ---- 总览 ---- */
  .tiles { display:grid; gap:12px; grid-template-columns:repeat(var(--cols,4),minmax(0,1fr)); }
  .tile { display:flex; flex-direction:column; gap:10px; padding:16px 16px 14px; border:1px solid var(--hairline); border-radius:12px; background:var(--surface); cursor:pointer; text-align:left; position:relative; overflow:hidden; }
  .tile::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--s); }
  .tile:hover { border-color:var(--hairline-strong); }
  .tile-h { display:flex; align-items:center; gap:8px; color:var(--steel); font-size:13px; }
  .tile-h .ic { width:18px; height:18px; color:var(--charcoal); }
  .tile-h .si { margin-left:auto; } .tile-h .si .ic { color:var(--si); }
  .tile-v { display:flex; align-items:baseline; gap:6px; color:var(--ink); }
  .tile-v b { font-size:30px; font-weight:600; letter-spacing:-.6px; color:var(--ink); line-height:1; font-variant-numeric:tabular-nums; }
  .tile-v span { color:var(--stone); font-size:12.5px; }
  .sidechips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .alerts { display:flex; flex-direction:column; }
  .al { display:grid; grid-template-columns:20px 72px minmax(0,1fr); gap:10px; align-items:start; padding:8px 0; border-top:1px solid var(--hairline-soft); font-size:12.5px; }
  .al:first-child { border-top:0; }
  .al .ic { width:16px; height:16px; margin-top:2px; }
  .al .t { color:var(--stone); font-variant-numeric:tabular-nums; }
  .al .x { color:var(--body); overflow-wrap:anywhere; }

  /* ---- 通用图表 ---- */
  .hb { display:grid; grid-template-columns:minmax(80px,max-content) minmax(0,1fr) max-content; gap:8px 12px; align-items:center; font-size:12.5px; }
  .hb .l { color:var(--body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .hb .v { color:var(--charcoal); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .hb .tr { position:relative; height:10px; background:var(--sunk); border-radius:3px; }
  .hb .tr i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--bc, var(--primary)); }
  .hb .tr .mk { left:auto; width:2px; margin-left:-1px; top:-3px; bottom:-3px; background:var(--bad); border-radius:1px; }
  .stk { display:flex; gap:2px; height:14px; border-radius:4px; overflow:hidden; background:var(--sunk); }
  .stk i { display:block; height:100%; min-width:3px; }
  .lg { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; font-size:12px; color:var(--body); }
  .lg span { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .lg i { width:9px; height:9px; border-radius:2px; display:inline-block; }
  .lg b { font-variant-numeric:tabular-nums; }
  .kpis { display:flex; flex-wrap:wrap; gap:24px 36px; }
  .kpi { display:flex; align-items:center; gap:12px; min-width:0; }
  .kpi .kv { font-size:24px; font-weight:600; color:var(--ink); letter-spacing:-.4px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .kpi .kv small { font-size:12px; color:var(--stone); font-weight:500; letter-spacing:0; margin-left:3px; }
  .kpi .kl { font-size:12px; color:var(--steel); }
  .kpi > .ic { width:20px; height:20px; color:var(--steel); }
  .ring { display:block; }
  .ring .trk { stroke:var(--sunk); } .ring .arc { stroke:var(--s, var(--primary)); }
  .ringbox { display:flex; align-items:center; gap:16px; }
  .rows > * + * { border-top:1px solid var(--hairline-soft); }
  .srow { display:grid; grid-template-columns:minmax(120px,170px) minmax(0,1fr) minmax(0,1fr) 72px; gap:24px; align-items:center; padding:12px 0; }
  .srow .nm { color:var(--charcoal); font-size:13px; font-weight:500; }
  .srow .nm code { display:block; color:var(--stone); font-size:11px; font-weight:400; }
  .srow .old { text-align:right; font-size:12px; }
  .srow-h { padding:0 0 4px; } .srow-h .ic { width:13px; height:13px; }
  .tally { display:flex; gap:12px; font-size:12px; color:var(--steel); font-variant-numeric:tabular-nums; }
  .tally span { display:inline-flex; align-items:center; gap:4px; } .tally .ic { width:13px; height:13px; }
  .area { width:100%; height:140px; display:block; }
  .area .ln { fill:none; stroke:var(--primary); stroke-width:2; vector-effect:non-scaling-stroke; }
  .area .fa { fill:var(--primary); opacity:.1; }
  .area .bg { stroke:var(--bad); stroke-width:1.5; stroke-dasharray:5 4; vector-effect:non-scaling-stroke; }
  .area .hit { fill:transparent; } .area .hit:hover { fill:var(--primary); opacity:.12; }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--stone); margin-top:4px; font-variant-numeric:tabular-nums; }
  .cols { display:flex; align-items:flex-end; gap:12px; height:150px; padding-top:8px; }
  .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .col i { width:min(64px,90%); border-radius:4px 4px 0 0; background:var(--s, var(--primary)); min-height:3px; }
  .col .cn { font-size:14px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .col .cl { font-size:11.5px; color:var(--steel); white-space:nowrap; }
  .squares { display:flex; flex-wrap:wrap; gap:4px; }
  .sq { width:16px; height:16px; border-radius:3px; border:1.5px solid var(--primary); }
  .sq.busy { background:var(--primary); } .sq.off { border-style:dashed; border-color:var(--bad); }
  .pool { display:grid; grid-template-columns:92px minmax(0,1fr) 56px; gap:12px; align-items:center; padding:7px 0; font-size:12.5px; }
  .pool .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--charcoal); }
  .strip { position:relative; height:44px; border-radius:4px; background:linear-gradient(to right, var(--ok-zone) 0 var(--h), var(--warn-zone) var(--h) var(--u), var(--bad-zone) var(--u) 100%); }
  .strip .dt { position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; border-radius:50%; background:var(--s); opacity:.8; }
  .strip .ln { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--ok); }
  .strip .ln.u { background:var(--bad); }
  .striprow { display:grid; grid-template-columns:150px minmax(0,1fr) 120px; gap:16px; align-items:center; padding:10px 0; }
  .striprow .v { text-align:right; }
  .wk { display:grid; grid-template-columns:36px minmax(0,1.3fr) minmax(0,1fr) 132px; gap:14px; align-items:center; padding:12px 0; }
  .av { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--primary-subtle); color:var(--primary); }
  .av .ic { width:18px; height:18px; }
  .wk-t { color:var(--charcoal); font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk-s { color:var(--steel); font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .wk-c { font-family:var(--mono); font-size:11px; color:var(--stone); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk .r { text-align:right; font-size:12px; color:var(--steel); font-variant-numeric:tabular-nums; }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:8px; }
  .st { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:8px; background:var(--soft); border:1px solid var(--hairline-soft); }
  .st.hot { background:var(--primary-subtle); border-color:transparent; }
  .st .n { font-size:20px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1; }
  .st .n.zero { color:var(--stone); font-weight:400; }
  .st .l { font-size:11.5px; color:var(--steel); text-align:center; line-height:1.3; }
  .st .w { display:flex; gap:3px; min-height:8px; }
  .st .w i { width:8px; height:8px; border-radius:50%; background:var(--primary); }
  .sha { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .sha .node { display:flex; flex-direction:column; gap:2px; padding:10px 14px; border-radius:8px; background:var(--soft); border:1px solid var(--hairline-soft); }
  .sha .node span { font-size:11.5px; color:var(--stone); }
  .sha .gap { display:flex; flex-direction:column; align-items:center; color:var(--steel); font-size:12px; }
  .steps { display:flex; gap:2px; }
  .step { flex:1; min-width:0; padding:8px; background:var(--soft); text-align:center; font-size:12px; color:var(--steel); }
  .step:first-child { border-radius:8px 0 0 8px; } .step:last-child { border-radius:0 8px 8px 0; }
  .step.s-ok, .step.s-bad, .step.s-warn { background:var(--sb); color:var(--si); }
  .issue-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .knob { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:8px 0; font-size:12.5px; }
  .knob code { color:var(--charcoal); }

  /* ---- 工作单 ---- */

<script>
"use strict";
// 数据契约：dashboard.data.js 由 gen_dashboard.py 每拍写出 window.DASH；本页只读不改。

// WSL 的 Chrome 没有彩色 emoji 字体，所有图标都是内联 SVG。

/* ============ 基础工具 ============ */
const esc = x => String(x ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const num = v => v==null || v==="" || Number.isNaN(Number(v)) ? "—" : (v = Number(v), Math.abs(v)>=1e12 ? v.toExponential(1) : Math.abs(v)>=1e9 ? (v/1e9).toFixed(1)+"B" : Math.abs(v)>=1e6 ? (v/1e6).toFixed(1)+"M" : Math.abs(v)>=1e4 ? (v/1e3).toFixed(0)+"k" : Number.isInteger(v) ? String(v) : v.toFixed(1));
const ft = n => !n ? "—" : num(n);
const money = (n, d=2) => "$" + (Number(n)||0).toFixed(d);
const hoursAgo = iso => iso ? (Date.now() - new Date(iso).getTime())/3600000 : null;
const fAge = h => h==null || Number.isNaN(h) ? "—" : h<1 ? Math.max(0,Math.round(h*60))+" 分" : h<48 ? (Math.round(h*10)/10)+" 时" : (Math.round(h/24*10)/10)+" 天";
const fMin = m => m==null ? "—" : m<60 ? Math.round(m)+" 分" : (m/60).toFixed(m<600?1:0)+" 时";
const fDur = s => s==null ? "—" : s<60 ? s+" 秒" : s<3600 ? Math.floor(s/60)+" 分" : Math.floor(s/3600)+" 时 "+Math.floor(s%3600/60)+" 分";
const hm = (t, sec) => { const d = new Date(t); const p = n => String(n).padStart(2,"0"); return p(d.getHours())+":"+p(d.getMinutes())+(sec?":"+p(d.getSeconds()):""); };
const utc = iso => iso ? String(iso).replace("T"," ").slice(5,16)+" UTC" : "—";
const liveSec = started => started ? Math.max(0, Math.floor((Date.now() - new Date(started).getTime())/1000)) : null;
const repoUrl = () => "https://github.com/" + (window.DASH && window.DASH.repo || "");
const issueLink = n => `<a href="${repoUrl()}/issues/${encodeURIComponent(n)}" target="_blank" rel="noopener">#${esc(n)}</a>`;
const ghLink = u => u&&u.pr ? `<a href="${repoUrl()}/pull/${esc(u.pr)}" target="_blank" rel="noopener">PR #${esc(u.pr)}</a>` : u&&u.issue ? `<a href="${repoUrl()}/issues/${esc(u.issue)}" target="_blank" rel="noopener">#${esc(u.issue)}</a>` : "";

/* ============ 图标（24 网格，描边 currentColor） ============ */
const P = {
  overview:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  intake:'<path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.6 5h12.8L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/>',
  advisor:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  workers:'<rect x="4.5" y="7" width="15" height="12" rx="3"/><path d="M12 3.5V7"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/><path d="M9.5 16h5"/>',
  orders:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v2.5H9z"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/>',
  ci:'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4.5v4h-4"/><path d="M10.5 9.2l4.5 2.8-4.5 2.8z"/>',
  release:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
  health:'<path d="M3 12h4l2.5-6 4 12 2.5-6h5"/>',
  cost:'<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6"/><path d="M5 12v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-6"/>',
  host:'<rect x="3.5" y="4" width="17" height="7" rx="2"/><rect x="3.5" y="13" width="17" height="7" rx="2"/><path d="M7.5 7.5h.01M7.5 16.5h.01M11 7.5h2M11 16.5h2"/>',
  ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.7 2.6L16 9.6"/>',
  warn:'<path d="M12 3.8l9 15.7H3z"/><path d="M12 10v4M12 17.2h.01"/>',

  none:'<circle cx="12" cy="12" r="9" stroke-dasharray="2.5 3"/><path d="M8.5 12h7"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/>',

  git:'<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 8.2v7.6M18 11.2c0 4-4 4.5-9.8 5.6"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',

  knob:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',

  link:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
};
const ic = (n, cls="") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||""}</svg>`;

/* ============ 状态 ============ */
// node_health.py / gen_dashboard.py 给出的状态词 → 页面的四种颜色键
const SK = {OK:"ok", WARN:"warn", UNHEALTHY:"bad", "NO-DATA":"none", "N/A":"none", ok:"ok", warn:"warn", bad:"bad", none:"none"};
const SL = {ok:"健康", warn:"警告", bad:"不健康", none:"无数据"};
const RANK = {none:0, ok:1, warn:2, bad:3};
const sk = s => SK[s] || "none";
const worst = list => list.map(sk).reduce((w,s) => RANK[s]>RANK[w] ? s : w, "none");
const stIcon = s => ic(sk(s));
const bigIcon = s => `<span class="si s-${sk(s)}">${ic(sk(s),"big")}</span>`;
const stChip = (s, txt) => { s = sk(s); return `<span class="chip s-${s}">${ic(s)}${esc(txt ?? SL[s])}</span>`; };
const judge = (v, sd) => v==null || !sd ? "NO-DATA" : (sd.higher_is_better ? v>=sd.healthy : v<=sd.healthy) ? "OK"
  : (sd.higher_is_better ? v<=sd.unhealthy : v>=sd.unhealthy) ? "UNHEALTHY" : "WARN";

/* ============ 图表小工具 ============ */
// 子弹条：value 落在 健康 / 警告 / 不健康 三段上，两条竖线是健康线（绿）与不健康线（红），超出刻度时右端有箭头。
function bullet(o) {
  const s = sk(o.status), hib = !!o.hib, h = Number(o.healthy), u = Number(o.unhealthy);
  const span = Math.max(Math.abs(h), Math.abs(u));
  const top = (o.top || span * (hib ? 1.4 : 1.6)) || 1;
  const pct = x => Math.max(0, Math.min(100, 100 * x / top));

    <div class="bul-t">${zones.filter(z=>pct(z[1])>pct(z[0])).map(z=>`<i class="z z-${z[2]}" style="left:${pct(z[0])}%;width:${pct(z[1])-pct(z[0])}%"></i>`).join("")}${v==null?"":`<i class="f" style="width:${Math.max(1.5,pct(v))}%"></i>`}${o.budget?"":`<i class="th" style="left:${pct(h)}%"></i>`}<i class="th u" style="left:${pct(u)}%"></i>${v!=null&&v>top?'<i class="ov"></i>':""}</div>

// 环形量表：pct 0–100；marks 是界线位置（百分比）

    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--${m.c})" stroke-width="2" stroke-linecap="round"/>`; }).join("");

    <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>

const ALERT_IC = l => /UNHEALTHY|failure|failed|BROKEN|red/i.test(l) ? "bad" : /HELD|held|unknown|WARN|stale/i.test(l) ? "warn" : "bell";

  const A = (D.alerts_tail||[]).slice().sort((x,y) => at(y)-at(x)).slice(0, n || 99);

  const bw = W/pts.length;
  return `<svg class="area" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="fa" d="${line}L${W},${H}L0,${H}Z"/><path class="ln" d="${line}"/>
    ${budget?`<line class="bg" x1="0" x2="${W}" y1="${y(budget).toFixed(1)}" y2="${y(budget).toFixed(1)}"/>`:""}
    ${pts.map((p,i)=>`<rect class="hit" x="${(x(i)-bw/2).toFixed(1)}" y="0" width="${bw.toFixed(2)}" height="${H}" data-tip="${esc(hm(p.t*1000, true)+" · "+p.v.toFixed(2)+" GB/时")}"/>`).join("")}</svg>
    <div class="axis"><span>${hm(pts[0].t*1000)}</span>${budget?`<span style="color:var(--bad-ink)">--- 预算 ${budget} GB/时</span>`:""}<span>${hm(pts[pts.length-1].t*1000)}</span></div>`;

      <span class="fq-x" title="本阶段由流水线事件或验收结果确认的时间">${x.verified_epoch ? fDur(Math.max(0, nowS - x.verified_epoch)) + "前" : "未确认"}</span></div>`; }).join("");
  return panel("orders", "创始人需求", `<div class="lwbar"><span class="lwlg">${chips}</span></div>${R.items.length ? `<div class="frq-list">${rows}</div>` : emptyMsg("没有未完成的创始人需求")}`,
    R.partial ? stChip("bad", "GitHub 不可用，仅列 units") : "");
}
function roiLinePanel(D) {
  const T = D.factory && D.factory.trend;
  if (!T || !Array.isArray(T.daily)) return panel("arrow", "每日 ROI", emptyMsg("ROI 数据不可用"));
  const hit = (T.retro || []).slice(-1)[0];
  return panel("arrow", "每日 ROI", `<div class="tgrid">${T.daily.map(s => trendCard(s, T.days, T.milestones)).join("")}</div>
    <div class="lg"><span>规则：每张合入单花费连续 3 天上升 → 开复盘；${hit ? `最近触发 ${esc(hit.slice(5))}` : "窗口内未触发"}。花费按 token（多数记录无价格），合入单代替验收数。</span></div>`,
    hit === T.days[T.days.length - 1] ? stChip("bad", "触发复盘") : "");
}
function vOverview(D) {
  const tiles = MODULES.filter(m => ["health","cost","host"].includes(m.id)).map(m => { const s = safeSum(m, D);
    return `<button class="tile s-${sk(s.s)}" data-m="${m.id}" type="button"><div class="tile-h">${ic(m.icon)}${esc(m.nm)}<span class="si" data-tip="${esc(SL[sk(s.s)])}">${ic(sk(s.s))}</span></div>
      <div class="tile-v"><b>${s.v}</b>${s.u?`<span>${esc(s.u)}</span>`:""}</div><div class="sub">${esc(s.l)}</div>${tally(s.st)}</button>`; });
  return `<div class="stack16">${founderPanel(D)}${roiLinePanel(D)}${panel("arrow","流水线", pipeStrip(D), (FR(D).errors||{}).stages ? stChip("bad","阶段计数不可用") : "")}${livePanel(D)}<div class="tiles" style="--cols:${tiles.length}">${tiles.join("")}</div></div>`;
}
function vRoi(D) { return `<div class="stack16">${archivePanel(D)}${trendPanel(D)}</div>`; }
function sumRoi(D) { const F = D.factory, n = F && Array.isArray(F.archive) ? F.archive.length : null; return {s:"none", v: n==null ? "—" : n, l:"最近完成"}; }
function sumOverview(D) { const f = freshness(D); return {s: f.s, v: f.age==null ? "—" : fDur(Math.round(f.age)), l: "数据新鲜度"}; }

const MODULES = [
  {id:"overview", nm:"总览", en:"Overview", icon:"overview", render:vOverview, sum:sumOverview},
  {id:"intake",   nm:"入口 · 分诊", en:"Intake & triage", icon:"intake", render:vIntake, sum:sumIntake},
  {id:"advisor",  nm:"顾问", en:"Advisor", icon:"advisor", render:vAdvisor, sum:sumAdvisor},
  {id:"workers",  nm:"开发 · 评审", en:"Workers & review", icon:"workers", render:vWorkers, sum:sumWorkers},
  {id:"orders",   nm:"工作单", en:"Work orders", icon:"orders", render:vOrders, sum:sumOrders},
  {id:"ci",       nm:"CI", en:"Continuous integration", icon:"ci", render:vCi, sum:sumCi},
  {id:"release",  nm:"合并 · 发布", en:"Merge & release", icon:"release", render:vRelease, sum:sumRelease},
  {id:"health",   nm:"健康标准", en:"Health & standards", icon:"health", render:vHealth, sum:sumHealth},
  {id:"cost",     nm:"成本", en:"Cost & tokens", icon:"cost", render:vCost, sum:sumCost},
  {id:"roi",      nm:"效率 · ROI", en:"Efficiency & ROI", icon:"arrow", render:vRoi, sum:sumRoi},
  {id:"host",     nm:"主机 · 运行", en:"Host, network & knobs", icon:"host", render:vHost, sum:sumHost},
];
function safeSum(m, D) { try { return m.sum(D); } catch (e) { return {s:"none", v:"—", l:"出错"}; } }

/* ============ 外壳：导航、主题、刷新、提示 ============ */
const LS_MOD = "zfDash.module", LS_THEME = "zfDash.theme";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let current = lsGet(LS_MOD);
if (!MODULES.some(m => m.id===current)) current = "overview";

function renderModule(id) {
  const D = window.DASH, m = MODULES.find(x => x.id===id) || MODULES[0];
  const nav = document.getElementById("nav"), view = document.getElementById("view");
  if (!D) {
    nav.innerHTML = MODULES.map(x => `<button class="nv" type="button" data-m="${x.id}">${ic(x.icon)}<span class="nv-t">${esc(x.nm)}</span></button>`).join("");
    view.innerHTML = `<div class="unavail">${ic("bad")}<div><b style="color:inherit">数据不可用</b> · dashboard.data.js 尚未生成或无法解析<div class="sub">由 gen_dashboard.py 每拍写出；页面每 30 秒重试</div></div></div>`;
    return;
  }
  nav.innerHTML = MODULES.map(x => { const s = safeSum(x, D);
    return `<button class="nv ${x.id===m.id?"on":""}" type="button" data-m="${x.id}" title="${esc(x.nm+" · "+SL[sk(s.s)])}">${ic(x.icon)}<span class="nv-t">${esc(x.nm)}</span>${x.id==="overview"?"":`<span class="nv-n">${String(s.v).replace(/<[^>]*>/g,"")}</span>`}<i class="dot s-${sk(s.s)}"></i></button>`; }).join("");
  document.getElementById("title").innerHTML = `${ic(m.icon)}${esc(m.nm)}<small>${esc(m.en)}</small>`;
  const f = freshness(D);
  const STD = D.standards || {}, sample = scorecardFreshness(D, STD);
  const sampleStatus = sample.age==null ? "none" : sample.stale ? "bad" : "ok";
  const sampleLabel = sample.age==null ? "健康评分暂无样本" : sample.stale ? "健康评分已过期" : `健康评分 ${fDur(Math.round(sample.age))}前`;
  const commit = STD.source_commit ? String(STD.source_commit).slice(0,12) : "未知";
  const pause = STD.paused;
  const pauseLabel = pause ? `流水线暂停 · ${pause.since ? utc(pause.since) : "时间未知"} · ${pause.reason || "原因未知"}`
    : Object.prototype.hasOwnProperty.call(STD, "paused") ? "流水线运行中" : "流水线状态未知";
  const pipelineStatus = pause ? "warn" : Object.prototype.hasOwnProperty.call(STD, "paused") ? "ok" : "none";
  document.getElementById("fresh").innerHTML = `<span class="chip s-${f.s}" data-tip="看板数据生成于 ${esc(utc(D.generated))}\n每 30 秒自动刷新">${ic(f.s==="ok"?"clock":f.s)}${f.age==null?"—":fDur(Math.round(f.age))+"前"}</span><span class="chip s-${sampleStatus}" data-tip="评分采样于 ${esc(utc(sample.sampledAt))} · 每个调度拍采样">${ic(sampleStatus==="ok"?"clock":sampleStatus)}${sampleLabel}${sample.sampledAt?` · ${esc(utc(sample.sampledAt))}`:""}</span><span class="sub">运行版本 <code>${esc(commit)}</code></span><span class="chip s-${pipelineStatus}" data-tip="PAUSE 开始于 ${esc(pause&&pause.since?utc(pause.since):"—")}">${esc(pauseLabel)}</span>`;
  try { view.innerHTML = m.render(D); }
  catch (e) { view.innerHTML = `<div class="unavail">${ic("bad")}<div><b style="color:inherit">此模块渲染出错</b><div class="sub">${esc(e && e.stack || e)}</div></div></div>`; }
  document.title = `${m.nm} · the product 流水线看板`;
}
function go(id) { current = id; lsSet(LS_MOD, id); renderModule(id); window.scrollTo(0, 0); }

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-m],[data-f],[data-s],[data-p],[data-o]");
  if (!el || el.disabled) return;
  if (el.closest("a")) return;
  if (el.dataset.m) return go(el.dataset.m);
  if (el.dataset.f) { view.f = el.dataset.f; view.p = 0; }
  if (el.dataset.o) view.o = el.dataset.o;
  if (el.dataset.s) { view.s = el.dataset.s; view.p = 0; }
  if (el.dataset.p != null) view.p = Number(el.dataset.p);
  try { sessionStorage.setItem("unitsView2", JSON.stringify(view)); } catch (e) {}
  renderModule(current);
});

const THEMES = ["auto","light","dark"], TH_NM = {auto:"跟随系统", light:"浅色", dark:"深色"};
let theme = lsGet(LS_THEME); if (!THEMES.includes(theme)) theme = "auto";
function applyTheme() {
  if (theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").innerHTML = `${ic(theme==="auto"?"auto":theme==="light"?"sun":"moon")}${TH_NM[theme]}`;
}
document.getElementById("theme").addEventListener("click", () => { theme = THEMES[(THEMES.indexOf(theme)+1)%3]; lsSet(LS_THEME, theme); applyTheme(); });

const tip = document.getElementById("tip");
document.addEventListener("mouseover", ev => { const el = ev.target.closest && ev.target.closest("[data-tip]"); const t = el && el.getAttribute("data-tip");
  if (!t) { tip.classList.remove("on"); return; } tip.textContent = t; tip.classList.add("on"); });
document.addEventListener("mousemove", ev => { if (!tip.classList.contains("on")) return;
  const w = tip.offsetWidth, h = tip.offsetHeight, x = Math.min(ev.clientX + 14, innerWidth - w - 8), y = ev.clientY + 16 + h > innerHeight ? ev.clientY - h - 12 : ev.clientY + 16;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px"; });
document.addEventListener("mouseleave", () => tip.classList.remove("on"));

// 每 30 秒重新载入数据：新脚本成功执行后 window.DASH 换成新对象才重画；解析失败（写到一半）保留旧数据。
function reloadData() {
  const prev = window.DASH, s = document.createElement("script");
  s.src = "dashboard.data.js?t=" + Date.now();
  s.onload = () => { s.remove(); renderModule(current); if (window.DASH !== prev) tip.classList.remove("on"); };
  s.onerror = () => { s.remove(); renderModule(current); };
  document.head.appendChild(s);
}
applyTheme();
renderModule(current);
setInterval(reloadData, 30000);
setTimeout(() => location.reload(), 30 * 60 * 1000);
window.__dash = {MODULES, renderModule};
</script>
</body>
</html>
