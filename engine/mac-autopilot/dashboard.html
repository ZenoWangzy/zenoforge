<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenoforge</title>
<style>
  /* 设计令牌：全部取自 Radix Colors 3.0。灰阶 slate；强调 indigo；状态 green、amber、red；类别 blue、orange、teal、amber、pink、grass、violet、tomato。
     用法按 Radix：1 到 2 页面底色，3 到 5 组件底色，6 到 8 边框，9 实心色，11 到 12 文字。 */
  :root {
    --font:"Manrope","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  :root {
    color-scheme:light;
    --canvas:#f9f9fb;
    --surface:#fcfcfd;
    --soft:#f9f9fb;
    --sunk:#f0f0f3;
    --hairline:#d9d9e0;
    --hairline-soft:#e8e8ec;
    --hairline-strong:#cdced6;
    --ink:#1c2024;
    --charcoal:#1c2024;
    --body:#60646c;
    --steel:#60646c;
    --stone:#8b8d98;
    --primary:#3a5bc7;
    --primary-subtle:#edf2fe;
    --on-primary:#fdfdfe;
    --ok:#30a46c;
    --warn:#ffc53d;
    --bad:#e5484d;
    --none:#8b8d98;
    --ok-ink:#218358;
    --warn-ink:#ab6400;
    --bad-ink:#ce2c31;
    --none-ink:#60646c;
    --ok-bg:#e6f6eb;
    --warn-bg:#fff7c2;
    --bad-bg:#feebec;
    --none-bg:#f0f0f3;
    --ok-zone:#00a83829;
    --warn-zone:#ffd40063;
    --bad-zone:#ff000824;
    --c1:#0090ff;
    --c2:#f76b15;
    --c3:#12a594;
    --c4:#ffc53d;
    --c5:#d6409f;
    --c6:#46a758;
    --c7:#6e56cf;
    --c8:#e54d2e;
    --link:#0d74ce;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme:dark;
      --canvas:#111113;
      --surface:#18191b;
      --soft:#212225;
      --sunk:#272a2d;
      --hairline:#363a3f;
      --hairline-soft:#272a2d;
      --hairline-strong:#43484e;
      --ink:#edeef0;
      --charcoal:#edeef0;
      --body:#b0b4ba;
      --steel:#b0b4ba;
      --stone:#696e77;
      --primary:#9eb1ff;
      --primary-subtle:#182449;
      --on-primary:#11131f;
      --ok:#30a46c;
      --warn:#ffc53d;
      --bad:#e5484d;
      --none:#696e77;
      --ok-ink:#3dd68c;
      --warn-ink:#ffca16;
      --bad-ink:#ff9592;
      --none-ink:#b0b4ba;
      --ok-bg:#132d21;
      --warn-bg:#302008;
      --bad-bg:#3b1219;
      --none-bg:#212225;
      --ok-zone:#11ff992d;
      --warn-zone:#fc820032;
      --bad-zone:#fe0a3b44;
      --c1:#0090ff;
      --c2:#f76b15;
      --c3:#12a594;
      --c4:#ffc53d;
      --c5:#d6409f;
      --c6:#46a758;
      --c7:#6e56cf;
      --c8:#e54d2e;
      --link:#70b8ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --canvas:#111113;
    --surface:#18191b;
    --soft:#212225;
    --sunk:#272a2d;
    --hairline:#363a3f;
    --hairline-soft:#272a2d;
    --hairline-strong:#43484e;
    --ink:#edeef0;
    --charcoal:#edeef0;
    --body:#b0b4ba;
    --steel:#b0b4ba;
    --stone:#696e77;
    --primary:#9eb1ff;
    --primary-subtle:#182449;
    --on-primary:#11131f;
    --ok:#30a46c;
    --warn:#ffc53d;
    --bad:#e5484d;
    --none:#696e77;
    --ok-ink:#3dd68c;
    --warn-ink:#ffca16;
    --bad-ink:#ff9592;
    --none-ink:#b0b4ba;
    --ok-bg:#132d21;
    --warn-bg:#302008;
    --bad-bg:#3b1219;
    --none-bg:#212225;
    --ok-zone:#11ff992d;
    --warn-zone:#fc820032;
    --bad-zone:#fe0a3b44;
    --c1:#0090ff;
    --c2:#f76b15;
    --c3:#12a594;
    --c4:#ffc53d;
    --c5:#d6409f;
    --c6:#46a758;
    --c7:#6e56cf;
    --c8:#e54d2e;
    --link:#70b8ff;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--canvas); color:var(--body); }
  body { font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  code, .mono { font-family:var(--mono); font-size:12px; }
  b, strong { color:var(--charcoal); font-weight:600; }
  button { font:inherit; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }

  /* ---- 外框：左侧模块栏 + 右侧视图 ---- */
  .app { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
  .side { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; padding:20px 12px; background:var(--surface); border-right:0.5px solid var(--hairline); }
  .brand { display:flex; align-items:center; gap:10px; padding:0 8px 18px; color:var(--ink); font-weight:600; font-size:14px; letter-spacing:-.2px; }
  .brand .mark { width:22px; height:22px; color:var(--primary); }
  .brand small { color:var(--stone); font-weight:500; font-size:12px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nv { display:flex; align-items:center; gap:10px; width:100%; height:38px; padding:0 10px; border:0; border-radius:6px; background:transparent; color:var(--steel); cursor:pointer; text-align:left; }
  .nv:hover { background:var(--soft); color:var(--charcoal); }
  .nv.on { background:var(--primary-subtle); color:var(--primary); }
  .nv.on .nv-t { font-weight:600; }
  .nv .ic { width:18px; height:18px; flex:none; }
  .nv-t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
  .nv-n { font-size:12px; padding:0 6px; border-radius:999px; font-variant-numeric:tabular-nums; }
  .nv-n.s-bad { background:var(--bad-bg); color:var(--bad-ink); } .nv-n.s-warn { background:var(--warn-bg); color:var(--warn-ink); }
    .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--none); }
  .dot.s-ok { background:var(--ok); } .dot.s-warn { background:var(--warn); } .dot.s-bad { background:var(--bad); }
  .side-foot { margin-top:auto; padding:12px 8px 0; border-top:0.5px solid var(--hairline-soft); display:flex; align-items:center; gap:8px; color:var(--stone); font-size:12px; }
  .ghost { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:0.5px solid var(--hairline); border-radius:4px; background:transparent; color:var(--steel); cursor:pointer; font-size:12px; }
  .ghost:hover { background:var(--soft); color:var(--charcoal); }
  .ghost.on { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
  .ghost[disabled] { opacity:.4; cursor:default; }
  .ghost .ic { width:14px; height:14px; }
  .flip { transform:scaleX(-1); }
  .ic.big { width:20px; height:20px; }

  main { min-width:0; padding:24px 32px 48px; }
  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .top h1 { margin:0; color:var(--ink); font-size:24px; font-weight:600; letter-spacing:-.5px; line-height:1.2; display:flex; align-items:center; gap:10px; }
  .top h1 .ic { width:22px; height:22px; color:var(--primary); }
  .top h1 small { font-size:14px; color:var(--stone); font-weight:500; letter-spacing:0; }
  .fresh { display:inline-flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--steel); }

  /* ---- 面板与网格 ---- */
  .grid { display:grid; gap:16px; }
  .g2 { grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); }
  .g3 { grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); }
  .g4 { grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); }
  .stack16 > * + * { margin-top:16px; }
  .panel { background:var(--surface); border:0.5px solid var(--hairline); border-radius:8px; padding:18px 20px; min-width:0; }
  .panel.span2 { grid-column:1 / -1; }
  .masonry { columns:2 420px; column-gap:16px; margin-bottom:-16px; }
  .masonry > .panel { break-inside:avoid; margin:0 0 16px; }
  .stack16 > .masonry + * { margin-top:16px; }
  .ph { display:flex; align-items:center; gap:8px; margin:0 0 14px; color:var(--charcoal); font-size:14px; font-weight:600; }
  .ph .ic { width:16px; height:16px; color:var(--steel); }
  .ph .aside { margin-left:auto; font-weight:400; font-size:12px; color:var(--stone); display:flex; align-items:center; gap:8px; }
  .sub { color:var(--stone); font-size:12px; }
  .muted { color:var(--steel); }
  .ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; flex:none; }
  .s-ok { --s:var(--ok); --si:var(--ok-ink); --sb:var(--ok-bg); }
  .s-warn { --s:var(--warn); --si:var(--warn-ink); --sb:var(--warn-bg); }
  .s-bad { --s:var(--bad); --si:var(--bad-ink); --sb:var(--bad-bg); }
  .s-none { --s:var(--none); --si:var(--none-ink); --sb:var(--none-bg); }
  .si { color:var(--si); }
  .chip { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:4px; background:var(--sb, var(--sunk)); color:var(--si, var(--steel)); font-size:12px; font-weight:500; white-space:nowrap; }
  .chip .ic { width:13px; height:13px; }
  .tag { display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:4px; background:var(--sunk); color:var(--steel); font-size:12px; white-space:nowrap; }
  .empty { display:flex; align-items:center; gap:8px; color:var(--stone); font-size:14px; padding:6px 0; }
  .unavail { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:6px; background:var(--bad-bg); color:var(--bad-ink); font-size:14px; }
  .unavail .sub { color:inherit; opacity:.8; }

  /* ---- 子弹条：数值 + 健康区 / 警告区 / 不健康区 + 两条界线 ---- */

  /* ---- 总览 ---- */
  .tiles { display:grid; gap:12px; grid-template-columns:repeat(var(--cols,4),minmax(0,1fr)); }
  .tile { display:flex; flex-direction:column; gap:10px; padding:16px 16px 14px; border:0.5px solid var(--hairline); border-radius:8px; background:var(--surface); cursor:pointer; text-align:left; position:relative; overflow:hidden; }
    .tile:hover { border-color:var(--hairline-strong); }
  .tile-h { display:flex; align-items:center; gap:8px; color:var(--steel); font-size:14px; }
  .tile-h .ic { width:18px; height:18px; color:var(--charcoal); }
  .tile-h .si { margin-left:auto; } .tile-h .si .ic { color:var(--si); }
  .tile-v { display:flex; align-items:baseline; gap:6px; color:var(--ink); }
  .tile-v b { font-size:24px; font-weight:600; letter-spacing:-.6px; color:var(--ink); line-height:1; font-variant-numeric:tabular-nums; }
  .tile-v span { color:var(--stone); font-size:12px; }
  .sidechips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .alerts { display:flex; flex-direction:column; }
  .al { display:grid; grid-template-columns:20px 72px minmax(0,1fr); gap:10px; align-items:start; padding:8px 0; border-top:0.5px solid var(--hairline-soft); font-size:12px; }
  .al:first-child { border-top:0; }
  .al .ic { width:16px; height:16px; margin-top:2px; }
  .al .t { color:var(--stone); font-variant-numeric:tabular-nums; }
  .al .x { color:var(--body); overflow-wrap:anywhere; }

  /* ---- 通用图表 ---- */
  .hb { display:grid; grid-template-columns:minmax(80px,max-content) minmax(0,1fr) max-content; gap:8px 12px; align-items:center; font-size:12px; }
  .hb .l { color:var(--body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .hb .v { color:var(--charcoal); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .hb .tr { position:relative; height:10px; background:var(--sunk); border-radius:2px; }
  .hb .tr i { position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--bc, var(--primary)); }
  .hb .tr .mk { left:auto; width:2px; margin-left:-1px; top:-3px; bottom:-3px; background:var(--bad); border-radius:1px; }
  .stk { display:flex; gap:2px; height:14px; border-radius:4px; overflow:hidden; background:var(--sunk); }
  .stk i { display:block; height:100%; min-width:3px; }
  .lg { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; font-size:12px; color:var(--body); }
  .lg span { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .lg i { width:9px; height:9px; border-radius:2px; display:inline-block; }
  .lg b { font-variant-numeric:tabular-nums; }
  .kpis { display:flex; flex-wrap:wrap; gap:24px 36px; }
  .kpi { display:flex; align-items:center; gap:12px; min-width:0; }
  .kpi .kv { font-size:24px; font-weight:600; color:var(--ink); letter-spacing:-.4px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .kpi .kv small { font-size:12px; color:var(--stone); font-weight:500; letter-spacing:0; margin-left:3px; }
  .kpi .kl { font-size:12px; color:var(--steel); }
  .kpi > .ic { width:20px; height:20px; color:var(--steel); }
  .ring { display:block; }
  .ring .trk { stroke:var(--sunk); } .ring .arc { stroke:var(--s, var(--primary)); }
  .ringbox { display:flex; align-items:center; gap:16px; }
  .rows > * + * { border-top:0.5px solid var(--hairline-soft); }
  .srow { display:grid; grid-template-columns:minmax(110px,160px) minmax(0,1fr) minmax(0,1fr) 64px; gap:24px; align-items:center; padding:6px 0; border-top:0.5px solid var(--hairline); }
  .srow .nm { color:var(--charcoal); font-size:14px; font-weight:500; }
  .srow .nm code { display:block; color:var(--stone); font-size:12px; font-weight:400; }
  .srow .old { text-align:right; font-size:12px; }
  .srow-h { padding:0 0 4px; } .srow-h .ic { width:13px; height:13px; }
  .tally { display:flex; gap:12px; font-size:12px; color:var(--steel); font-variant-numeric:tabular-nums; }
  .tally span { display:inline-flex; align-items:center; gap:4px; } .tally .ic { width:13px; height:13px; }
  .area { width:100%; height:140px; display:block; }
  .area .ln { fill:none; stroke:var(--primary); stroke-width:2; vector-effect:non-scaling-stroke; }
  .area .fa { fill:var(--primary); opacity:.1; }
  .area .bg { stroke:var(--bad); stroke-width:1.5; stroke-dasharray:5 4; vector-effect:non-scaling-stroke; }
  .area .hit { fill:transparent; } .area .hit:hover { fill:var(--primary); opacity:.12; }
  .axis { display:flex; justify-content:space-between; font-size:12px; color:var(--stone); margin-top:4px; font-variant-numeric:tabular-nums; }
  .cols { display:flex; align-items:flex-end; gap:12px; height:150px; padding-top:8px; }
  .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .col i { width:min(64px,90%); border-radius:4px 4px 0 0; background:var(--s, var(--primary)); min-height:3px; }
  .col .cn { font-size:14px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .col .cl { font-size:12px; color:var(--steel); white-space:nowrap; }
  .squares { display:flex; flex-wrap:wrap; gap:4px; }
  .sq { width:16px; height:16px; border-radius:2px; border:1.5px solid var(--primary); }
  .sq.busy { background:var(--primary); } .sq.off { border-style:dashed; border-color:var(--bad); }
  .pool { display:grid; grid-template-columns:92px minmax(0,1fr) 56px; gap:12px; align-items:center; padding:7px 0; font-size:12px; }
  .pool .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--charcoal); }
  .strip { position:relative; height:44px; border-radius:4px; background:linear-gradient(to right, var(--ok-zone) 0 var(--h), var(--warn-zone) var(--h) var(--u), var(--bad-zone) var(--u) 100%); }
  .strip .dt { position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; border-radius:50%; background:var(--s); opacity:.8; }
  .strip .ln { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--ok); }
  .strip .ln.u { background:var(--bad); }
  .striprow { display:grid; grid-template-columns:150px minmax(0,1fr) 120px; gap:16px; align-items:center; padding:10px 0; }
  .striprow .v { text-align:right; }
  .wk { display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:14px; align-items:center; padding:12px 0; }
  .av { width:36px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; background:var(--primary-subtle); color:var(--primary); }
  .av .ic { width:18px; height:18px; }
  .wk-t { color:var(--charcoal); font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk-s { color:var(--steel); font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .wk-c { font-family:var(--mono); font-size:12px; color:var(--stone); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk .r { text-align:right; font-size:12px; color:var(--steel); font-variant-numeric:tabular-nums; }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:8px; }
  .st { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:6px; background:var(--soft); border:0.5px solid var(--hairline-soft); }
  .st.hot { background:var(--primary-subtle); border-color:transparent; }
  .st .n { font-size:24px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1; }
  .st .n.zero { color:var(--stone); font-weight:400; }
  .st .l { font-size:12px; color:var(--steel); text-align:center; line-height:1.3; }
  .st .w { display:flex; gap:3px; min-height:8px; }
  .st .w i { width:8px; height:8px; border-radius:50%; background:var(--primary); }
  .sha { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .sha .node { display:flex; flex-direction:column; gap:2px; padding:10px 14px; border-radius:6px; background:var(--soft); border:0.5px solid var(--hairline-soft); }
  .sha .node span { font-size:12px; color:var(--stone); }
  .sha .gap { display:flex; flex-direction:column; align-items:center; color:var(--steel); font-size:12px; }
  .steps { display:flex; gap:2px; }
  .step { flex:1; min-width:0; padding:8px; background:var(--soft); text-align:center; font-size:12px; color:var(--steel); }
  .step:first-child { border-radius:6px 0 0 6px; } .step:last-child { border-radius:0 6px 6px 0; }
  .step.s-ok, .step.s-bad, .step.s-warn { background:var(--sb); color:var(--si); }
  .issue-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .knob { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:8px 0; font-size:12px; }
  .knob code { color:var(--charcoal); }

  /* ---- 工作单 ---- */
  .tkstrip { display:flex; gap:2px; height:28px; border-radius:4px; overflow:hidden; margin-bottom:10px; }
  .tkstrip button { border:0; color:#fff; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 6px; min-width:26px; font-variant-numeric:tabular-nums; }
  .tkstrip button.off { opacity:.3; }
  .bar-ctl { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:12px 0; }
  .tk { display:grid; grid-template-columns:minmax(0,1fr) minmax(200px,280px) 96px; gap:20px; align-items:center; padding:14px 0; border-top:0.5px solid var(--hairline-soft); }
  .tk-title { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; color:var(--charcoal); }
  .tk-title .sd { width:9px; height:9px; border-radius:50%; background:var(--c); flex:none; }
  .tk-title b { font-weight:600; }
  .tk-meta { font-size:12px; color:var(--stone); margin-top:2px; }
  .track { display:flex; align-items:center; margin-top:8px; font-size:12px; flex-wrap:wrap; row-gap:4px; }
  .track .s { display:flex; align-items:center; gap:4px; color:var(--stone); white-space:nowrap; }
  .track .s i { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--hairline-strong); background:var(--surface); }

// 子弹条：value 落在 健康 / 警告 / 不健康 三段上，两条竖线是健康线（绿）与不健康线（红），超出刻度时右端有箭头。
function bullet(o) {
  const s = sk(o.status), hib = !!o.hib, h = Number(o.healthy), u = Number(o.unhealthy);
  const top = (o.top || Math.max(Math.abs(h), Math.abs(u)) * (hib ? 1.4 : 1.6)) || 1;
  const pct = x => Math.max(0, Math.min(100, 100 * x / top));
  const zones = hib ? [[0,u,"bad"],[u,h,"warn"],[h,top,"ok"]] : [[0,h,"ok"],[h,u,"warn"],[u,top,"bad"]];
  const v = o.value==null ? null : Number(o.value), nl = !String(o.label||"").trim();
  const short = (o.long_status ? ` · 长窗 ${o.long_status}` : "") + (o.status==="LOW-N" && o.sample_n!=null ? ` · n=${o.sample_n}` : "") + (Object.prototype.hasOwnProperty.call(o,"value_1h") ? ` · ${o.value_1h==null?"短窗无数据":`${o.short_window||"1h"} ${num(o.value_1h)} ${o.trend_1h?`${o.trend_1h.direction==="up"?"↑":o.trend_1h.direction==="down"?"↓":"→"}${o.trend_1h.delta>0?"+":""}${num(o.trend_1h.delta)}`:"趋势无数据"}`}` : "");
  const tip = [o.label, o.desc, o.meaning, o.standard_basis, o.budget ? "预算 "+num(u) : (hib?"健康 ≥ ":"健康 ≤ ")+num(h)+(hib?"，不健康 ≤ ":"，不健康 ≥ ")+num(u), o.id].filter(Boolean).join("\n");
  return `<div class="bul zr s-${s}${nl?" nl":""}" data-tip="${esc(tip)}">${nl?"":`<i class="ad s-${s}"></i><span class="bul-l">${esc(o.label)}</span>`}
    <span class="a-t">${zones.filter(z=>pct(z[1])>pct(z[0])).map(z=>`<i class="z-${z[2]}" style="left:${pct(z[0])}%;width:${pct(z[1])-pct(z[0])}%"></i>`).join("")}${v==null?"":`<b style="left:${Math.min(pct(v),99)}%"></b>`}</span>
    <span class="bul-v"><b>${o.shown ?? num(v)}</b><small>${esc(o.unit||"")}${short}</small></span></div>`;
}
// 环形量表：pct 0–100；marks 是界线位置（百分比）
function ring(pct, s, size=84, center="", marks=[]) {
  const r = (size-10)/2, c = 2*Math.PI*r, p = Math.max(0, Math.min(100, Number(pct)||0));
  const mk = marks.map(m => { const a = (m.at/100)*2*Math.PI - Math.PI/2, x1 = size/2+Math.cos(a)*(r-7), y1 = size/2+Math.sin(a)*(r-7), x2 = size/2+Math.cos(a)*(r+7), y2 = size/2+Math.sin(a)*(r+7);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--${m.c})" stroke-width="2" stroke-linecap="round"/>`; }).join("");
  return `<svg class="ring s-${sk(s)}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="8"/>
    <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    ${mk}<text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="var(--ink)" font-size="${size>80?17:14}" font-weight="600" font-family="inherit">${esc(center)}</text></svg>`;
}
// 横条列表：rows = [{label, value, shown, color, tip, mark}]
function hbars(rows, max) {
  const m = max || Math.max(1e-9, ...rows.map(r => Math.max(Number(r.value)||0, Number(r.mark)||0)));
  return `<div class="hb">${rows.map(r => `<span class="l" title="${esc(r.label)}">${r.html || esc(r.label)}</span>
    <span class="tr" data-tip="${esc(r.tip || r.label+"："+(r.shown ?? num(r.value)))}"><i style="width:${Math.max(0.8, Math.min(100, 100*(Number(r.value)||0)/m))}%;--bc:${r.color||"var(--primary)"}"></i>${r.mark!=null?`<i class="mk" style="left:${Math.min(100,100*r.mark/m)}%"></i>`:""}</span>
    <span class="v">${r.shown ?? num(r.value)}</span>`).join("")}</div>`;
}
// 堆叠条 + 图例：parts = [{label, value, color}]
function stack(parts, fmt=num) {

  return `<div class="stk">${ps.map(p=>`<i style="flex:${p.value};background:${p.color}" data-tip="${esc(p.label+"："+fmt(p.value)+"（"+Math.round(100*p.value/tot)+"%）")}"></i>`).join("")}</div>
    <div class="lg">${ps.map(p=>`<span><i style="background:${p.color}"></i>${esc(p.label)} <b>${fmt(p.value)}</b></span>`).join("")}</div>`;
}

      `${num(TE.first_pass_units || 0)} / ${num(TE.merged_units || 0)} 个合并单元`,
      "efficiency.first_pass_yield_pct_7d", "units.json 与 units-archive.json 的近 7 天合并单元；全历史 0 次 review-request-changes 与 review-block。")}
    ${teCard("repair", "返工阶段 token 占比", pct(TE.repair_pct),
      `${ft(TE.repair_tokens)} / ${ft(TE.window_tokens)} tokens`,
      "efficiency.repair_phase_pct_7d", "worker_cost repair phase 与同一 7 天终态单元 cohort；repair tokens ÷ cohort 全部 tokens。")}
    ${kcard("layers", "未归属", `${num(TE.unattributed?.ledger_keys || 0)} 条`,
      `<div class="sub">raw ${ft(TE.unattributed?.tokens)} tokens</div>`, TE.unattributed?.ledger_keys ? "warn" : "ok",
      "cost_ledger.by_unit 中无法关联到 units.json / units-archive.json 的 key 独立计数和汇总，不混入近 7 天 cohort。")}
    </div>`);
  return `<div class="stack16">${verdict}<div class="hks">${t1}${t2}${t3}${t4}${t5}${t6}${t7}</div>
    ${panel("warn", "要处理", pbody)}
    <div id="ov-workers">${livePanel(D)}</div>
    ${panel("arrow", "流水线", pipeStrip(D), (F.errors || {}).stages ? stChip("bad", "阶段计数不可用") : "")}
    ${tePanel}
    ${panel("health", "健康指标", (mrows ? mrows + (more > 0 ? `<div class="anom more" data-m="health">另有 ${more} 项</div>` : "") : emptyMsg("全部正常")), aside)}</div>`;
}
function vReqs(D) { return `<div class="stack16">${founderPanel(D)}</div>`; }
function sumReqs(D) { const R = D.founder_reqs;
  if (!R || R.error || !Array.isArray(R.items)) return {s:"bad", v:"—", l:"需求台账不可用"};
  const blocked = R.items.filter(x => x.blocker).length;
  return {s: blocked ? "warn" : "ok", v: R.items.length, l: blocked ? `未完成，${blocked} 条有卡点` : "未完成需求"}; }
function vRoi(D) { return `<div class="stack16">${roiLinePanel(D)}${archivePanel(D)}${trendPanel(D)}</div>`; }
function sumRoi(D) { const F = D.factory, n = F && Array.isArray(F.archive) ? F.archive.length : null; return {s:"none", v: n==null ? "—" : n, l:"最近完成"}; }
function sumOverview(D) { const f = freshness(D); return {s: f.s, v: f.age==null ? "—" : fDur(Math.round(f.age)), l: "数据新鲜度"}; }

const MODULES = [
  {id:"overview", nm:"总览", en:"Overview", icon:"overview", render:vOverview, sum:sumOverview},
  {id:"reqs",     nm:"需求", en:"Founder requirements", icon:"layers", render:vReqs, sum:sumReqs},
  {id:"intake",   nm:"入口与分诊", en:"Intake & triage", icon:"intake", render:vIntake, sum:sumIntake},
  {id:"advisor",  nm:"顾问", en:"Advisor", icon:"advisor", render:vAdvisor, sum:sumAdvisor},
  {id:"workers",  nm:"开发与评审", en:"Workers & review", icon:"workers", render:vWorkers, sum:sumWorkers},
  {id:"orders",   nm:"工作单", en:"Work orders", icon:"orders", render:vOrders, sum:sumOrders},
  {id:"ci",       nm:"CI", en:"Continuous integration", icon:"ci", render:vCi, sum:sumCi},
  {id:"release",  nm:"合并与发布", en:"Merge & release", icon:"release", render:vRelease, sum:sumRelease},
  {id:"health",   nm:"健康标准", en:"Health & standards", icon:"health", render:vHealth, sum:sumHealth},
  {id:"cost",     nm:"成本", en:"Cost & tokens", icon:"cost", render:vCost, sum:sumCost},
  {id:"roi",      nm:"效率与 ROI", en:"Efficiency & ROI", icon:"arrow", render:vRoi, sum:sumRoi},
  {id:"host",     nm:"主机与运行", en:"Host, network & knobs", icon:"host", render:vHost, sum:sumHost},
];
function safeSum(m, D) { try { return m.sum(D); } catch (e) { return {s:"none", v:"—", l:"出错"}; } }

/* ============ 外壳：导航、主题、刷新、提示 ============ */
const LS_MOD = "zfDash.module", LS_THEME = "zfDash.theme";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let current = lsGet(LS_MOD);
if (!MODULES.some(m => m.id===current)) current = "overview";

// 刷新时只替换真正变了的节点：滚动位置、展开状态、悬停都保留，数据没变就什么都不动
function morph(oldEl, html) {
  const t = document.createElement("template"); t.innerHTML = html;
  if (!t.content) { oldEl.innerHTML = html; return; } // 没有 template 的环境（测试桩）直接整体替换
  const walk = (a, b) => {
    const xs = [...a.childNodes], ys = [...b.childNodes];
    if (xs.length !== ys.length) { a.replaceChildren(...ys); return; }
    xs.forEach((x, i) => { const y = ys[i];
      if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { x.replaceWith(y); return; }
      if (x.nodeType === 3) { if (x.data !== y.data) x.data = y.data; return; }
      if (x.outerHTML === y.outerHTML) return;
      if (x.nodeName === "DETAILS") { const o = x.open; y.open = o; }
      const same = x.attributes.length === y.attributes.length && [...x.attributes].every(at => at.name === "open" || y.getAttribute(at.name) === at.value);
      if (!same) { x.replaceWith(y); return; }
      walk(x, y); });
  };
  walk(oldEl, t.content);
}
// 任务标题白话化：自动生成的事故单和 conventional commit 标题，对普通用户不可读。原文保留在 raw_* 字段。
// shortcut: 只认已见过的几种格式，其余原样显示；新格式出现后在这里补规则。
const INC_SRC = {"scheduler.log":"调度器", "worker-died":"员工异常退出", "budget-park":"额度暂停", "supervisor":"主管", "scheduler":"调度器"};
const TYPE_CN = {fix:"修复", feat:"新功能", chore:"维护", docs:"文档", refactor:"重构", test:"测试", perf:"性能"};
const SCOPE_CN = {fruit:"水果行业包", "web-advisor":"网页顾问", hotfix:"热修", ci:"CI", engine:"引擎", pipeline:"流水线"};
function plainTitle(t) {
  if (typeof t !== "string") return t;
  let m = t.match(/^Incident: scheduler\.log: refill done live=(\d+) secs=(\d+)/);
  if (m) return `调度器补位耗时 ${m[2]} 秒`;
  m = t.match(/^Incident: ([\w.-]+?)(?::| unit=| signature | budget-park)\s*(.*)$/);
  if (m) { const src = INC_SRC[m[1]] || m[1], rest = /budget-park/.test(t) ? "额度暂停" : /worker-died/.test(t) ? "员工异常退出" : /signature/.test(t) ? "重复故障" : "";
    return `事故：${src}${rest && !String(src).includes(rest) ? " " + rest : ""}`; }
  m = t.match(/^Incident: (.+)$/);
  if (m) return `事故：${m[1].slice(0, 24)}`;
  m = t.match(/^(fix|feat|chore|docs|refactor|test|perf)\(([^)]*)\): (.*)$/);
  if (m) return `${TYPE_CN[m[1]]} ${SCOPE_CN[m[2]] || m[2]}：${m[3]}`;
  return t;
}
function plainTitles(D) {
  const fix = (o, k) => { if (o && typeof o[k] === "string") { const v = plainTitle(o[k]); if (v !== o[k]) { o["raw_" + k] = o[k]; o[k] = v; } } };
  ((D.live_workers || {}).items || []).forEach(o => fix(o, "task"));
  ((D.factory || {}).archive || []).forEach(o => fix(o, "task"));
  (D.units || []).forEach(o => { fix(o, "title"); fix(o, "task"); });
}
function renderModule(id) {
  if (window.DASH) plainTitles(window.DASH);
  const D = window.DASH, m = MODULES.find(x => x.id===id) || MODULES[0];
  const nav = document.getElementById("nav"), view = document.getElementById("view");
  if (!D) {
    nav.innerHTML = MODULES.map(x => `<button class="nv" type="button" data-m="${x.id}">${ic(x.icon)}<span class="nv-t">${esc(x.nm)}</span></button>`).join("");
    view.innerHTML = `<div class="unavail">${ic("bad")}<div><b style="color:inherit">数据不可用</b>，dashboard.data.js 尚未生成或无法解析<div class="sub">由 gen_dashboard.py 每拍写出；页面每 30 秒重试</div></div></div>`;
    return;
  }
  // 导航分别显示不健康与警告数量，文案和总览状态 chip 保持一致。
  const navStatusCounts = id => { const ms = id==="overview"||id==="health" ? nodeMetrics(D) : modMetrics(D, id), counts = metricStatusGroups(ms); return {bad: counts.bad.length, warn: counts.warn.length}; };
  morph(nav, MODULES.map(x => { const a = navStatusCounts(x.id);
    const labels = [a.bad ? metricStatusText("bad", a.bad) : "", a.warn ? metricStatusText("warn", a.warn) : ""].filter(Boolean);
    const badges = [["bad", a.bad], ["warn", a.warn]].filter(([, n]) => n).map(([s, n]) => `<span class="nv-n s-${s}">${n}</span>`).join("");
    return `<button class="nv ${x.id===m.id?"on":""}" type="button" data-m="${x.id}" title="${esc(labels.length ? x.nm + "，" + labels.join("，") : x.nm)}">${ic(x.icon)}<span class="nv-t">${esc(x.nm)}</span>${badges}</button>`; }).join(""));
  morph(document.getElementById("title"), `${ic(m.icon)}${esc(m.nm)}<small>${esc(m.en)}</small>`);
  const f = freshness(D);
  const STD = D.standards || {}, sample = scorecardFreshness(D, STD);
  const sampleStatus = sample.age==null ? "none" : sample.stale ? "bad" : "ok";
  const sampleLabel = sample.age==null ? "健康评分暂无样本" : sample.stale ? "健康评分已过期" : `健康评分 ${fDur(Math.round(sample.age))}前`;
  const commit = STD.source_commit ? String(STD.source_commit).slice(0,12) : "未知";
  const pause = STD.paused;
  const pauseLabel = pause ? `流水线暂停，${pause.since ? utc(pause.since) : "时间未知"}，${pause.reason || "原因未知"}`
    : Object.prototype.hasOwnProperty.call(STD, "paused") ? "流水线运行中" : "流水线状态未知";
  const pipelineStatus = pause ? "warn" : Object.prototype.hasOwnProperty.call(STD, "paused") ? "ok" : "none";
  morph(document.getElementById("fresh"), `<span class="chip s-${f.s}" data-tip="看板数据生成于 ${esc(utc(D.generated))}\n每 30 秒自动刷新">${ic(f.s==="ok"?"clock":f.s)}${f.age==null?"—":fDur(Math.round(f.age))+"前"}</span><span class="chip s-${sampleStatus}" data-tip="评分采样于 ${esc(utc(sample.sampledAt))}，每个调度拍采样">${ic(sampleStatus==="ok"?"clock":sampleStatus)}${sampleLabel}${sample.sampledAt?`，${esc(utc(sample.sampledAt))}`:""}</span><span class="sub">运行版本 <code>${esc(commit)}</code></span><span class="chip s-${pipelineStatus}" data-tip="PAUSE 开始于 ${esc(pause&&pause.since?utc(pause.since):"—")}">${esc(pauseLabel)}</span>`);
  try { morph(view, m.render(D)); }
  catch (e) { view.innerHTML = `<div class="unavail">${ic("bad")}<div><b style="color:inherit">此模块渲染出错</b><div class="sub">${esc(e && e.stack || e)}</div></div></div>`; }
  document.title = `${m.nm}，Zenoforge`;
}
function go(id) { current = id; lsSet(LS_MOD, id); renderModule(id); window.scrollTo(0, 0); }

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-m],[data-f],[data-s],[data-p],[data-o],[data-rf],[data-rp]");
  if (!el || el.disabled) return;
  if (el.closest("a")) return;
  if (el.dataset.m) return go(el.dataset.m);
  if (el.dataset.f) { view.f = el.dataset.f; view.p = 0; }
  if (el.dataset.o) view.o = el.dataset.o;
  if (el.dataset.rf) { view.rf = el.dataset.rf; view.rp = 0; }
  if (el.dataset.rp != null) view.rp = Number(el.dataset.rp);
  if (el.dataset.s) { view.s = el.dataset.s; view.p = 0; }
  if (el.dataset.p != null) view.p = Number(el.dataset.p);
  try { sessionStorage.setItem("unitsView2", JSON.stringify(view)); } catch (e) {}
  renderModule(current);
});

const THEMES = ["auto","light","dark"], TH_NM = {auto:"跟随系统", light:"浅色", dark:"深色"};
let theme = lsGet(LS_THEME); if (!THEMES.includes(theme)) theme = "auto";
function applyTheme() {
  if (theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").innerHTML = `${ic(theme==="auto"?"auto":theme==="light"?"sun":"moon")}${TH_NM[theme]}`;
}
document.getElementById("theme").addEventListener("click", () => { theme = THEMES[(THEMES.indexOf(theme)+1)%3]; lsSet(LS_THEME, theme); applyTheme(); });

const tip = document.getElementById("tip");
document.addEventListener("mouseover", ev => { const el = ev.target.closest && ev.target.closest("[data-tip]"); const t = el && el.getAttribute("data-tip");
  if (!t) { tip.classList.remove("on"); return; } tip.textContent = t; tip.classList.add("on"); });
document.addEventListener("mousemove", ev => { if (!tip.classList.contains("on")) return;
  const w = tip.offsetWidth, h = tip.offsetHeight, x = Math.min(ev.clientX + 14, innerWidth - w - 8), y = ev.clientY + 16 + h > innerHeight ? ev.clientY - h - 12 : ev.clientY + 16;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px"; });
document.addEventListener("mouseleave", () => tip.classList.remove("on"));

// 每 30 秒重新载入数据：新脚本成功执行后 window.DASH 换成新对象才重画；解析失败（写到一半）保留旧数据。
function reloadData() {
  const prev = window.DASH, s = document.createElement("script");
  s.src = "dashboard.data.js?t=" + Date.now();
  s.onload = () => { s.remove(); renderModule(current); if (window.DASH !== prev) tip.classList.remove("on"); };
  s.onerror = () => { s.remove(); renderModule(current); };
  document.head.appendChild(s);
}
applyTheme();
renderModule(current);
setInterval(reloadData, 30000);
window.__dash = {MODULES, renderModule, problems, workQueue};
</script>
