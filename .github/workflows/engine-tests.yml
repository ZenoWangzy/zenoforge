name: engine-tests
on:
  push:
    branches: [main]
  pull_request:
    # Gate files (equal to the merge-pr.sh gate regex) plus engine/** and tools/**, which run only the focused selection; engine/pr-ci-gate-paths.test.sh checks both.
    paths:
      - engine/**
      - tools/**
      - .github/workflows/engine-tests.yml
      - tools/merge-pr.sh
      - tools/merge-pr-bootstrap.sh
      - tools/pin-vecta.sh
      - tools/auto-pin.sh
      - engine/eval/**
      - engine/mac-autopilot/bell.sh
      - engine/mac-autopilot/bell-loop.sh
      - engine/mac-autopilot/pin-lag.sh
      - engine/lib.d/main-red.sh
      - engine/lib.d/main-red-bisect.sh
      - engine/deploy-culprit.sh
      - engine/worktree-lifecycle.sh
      - engine/mac-autopilot/rescued_gc.sh
      - engine/mac-autopilot/scheduler.d/cleanup.sh
      - engine/mac-autopilot/scheduler.d/units.sh
      - engine/mac-autopilot/scheduler.d/review-rules.sh
      - engine/prompts/review-contract.md
      - engine/notify.sh
      - engine/ts-judge.sh
      - engine/redact-secrets.sh
      - engine/night/authorization-readonly.sh
      - engine/night/production-tenant-marker-readonly.sh
      - engine/night/node-health-rules.sh
      - engine/night/maintainer-health-mail.sh
      - engine/night/acceptance-login-probe.mjs
      - engine/systemd/zenoforge-agent.service
      - engine/systemd/zenoforge-daily-perf-report.service
      - engine/systemd/zenoforge-health-mail.service
      - engine/systemd/zenoforge-health-maintenance.service
      - engine/systemd/zenoforge-label-churn.service
      - engine/systemd/zenoforge-memory-check.service
      - engine/systemd/zenoforge-owner-report-causes.service
      - engine/systemd/zenoforge-retro.service
      - engine/systemd/zenoforge-roi-collector.service
      - engine/systemd/zenoforge-supervisor.service
  workflow_dispatch:

# main: every push has its own group, so a merge burst never replaces a waiting run. PRs: the latest push wins.
concurrency:
  # A pull_request run that starts after its PR merged resolves github.ref to the base branch; keyed by ref alone it
  # joined the main group with cancel-in-progress and cancelled main runs (8 in a row on 2026-11-21, row 875).
  # Keyed by sha, a push run never shares a group, so a newer push cannot replace it while it waits (52% cancelled, #1603).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      shard_count: ${{ steps.select.outputs.shard_count }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: select
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZF_PUBLIC_TEXT_DENYLIST: ''
        run: |
          merge_base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")"
          node engine/public-text-guard.mjs --base "origin/$BASE_REF" --head "$HEAD_SHA"
          suite_list="$(node engine/focused-test-paths.mjs --range "$merge_base" "$HEAD_SHA")"
          selection="$(node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const suites = input.split(/\r?\n/).filter(Boolean);
              const shardCount = Math.max(1, Math.min(8, Math.ceil(suites.length / 12)));
              console.log(JSON.stringify(suites));
              console.log(shardCount);
              console.log(JSON.stringify(Array.from({ length: shardCount }, (_, index) => index)));
            });
          ' <<< "$suite_list")"
          mapfile -t selection <<< "$selection"
          printf 'suites=%s\n' "${selection[0]}" >> "$GITHUB_OUTPUT"
          printf 'shard_count=%s\n' "${selection[1]}" >> "$GITHUB_OUTPUT"
          printf 'shards=%s\n' "${selection[2]}" >> "$GITHUB_OUTPUT"
  suites:
    needs: select
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.select.result == 'success' && needs.select.outputs.suites != '[]')) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && needs.select.outputs.shards || '[0,1,2,3,4,5,6,7]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # comment-ratchet parses shell with shfmt and TypeScript sources with typescript; the release binary goes on PATH without sudo.
      - name: Install comment-ratchet tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          npm install -g typescript
      - name: Check GitHub transport ratchet
        if: ${{ matrix.shard == 0 }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node tools/gh-transport-ratchet.mjs --base FETCH_HEAD
          else
            node tools/gh-transport-ratchet.mjs
          fi
      # Installs exactly the lockfile, which includes @typesafe-ai/sdk (engine/ts-judge.mjs's only npm runtime dependency).
      - run: npm ci
      - name: Run engine suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.select.outputs.shard_count }}
          SELECTED_SUITES: ${{ needs.select.outputs.suites }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            suite_file="$RUNNER_TEMP/engine-suites.txt"
            node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.parse(process.argv[2]).join("\n") + "\n")' "$suite_file" "$SELECTED_SUITES"
            ZF_SUITES_FILE="$suite_file" bash tools/run-engine-tests.sh "$SHARD" "$SHARD_COUNT"
          else
            bash tools/run-engine-tests.sh "$SHARD" 8
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.shard }}
          path: |
            engine-test-failures-${{ matrix.shard }}.txt
            test-logs/

  unitgen-load-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise unitgen load with launchd
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d "${TMPDIR:-/tmp}/unitgen-load.XXXXXX")"
          launchagents_dir="$smoke_root/LaunchAgents"
          plist="$launchagents_dir/unitgen-load-smoke.plist"
          marker="$smoke_root/loaded"
          uid="$(id -u)"
          domain="gui/$uid"
          mkdir -p "$launchagents_dir"
          cleanup() {
            launchctl bootout "$domain" "$plist" >/dev/null 2>&1 || true
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          python3 - "$plist" "$marker" "$smoke_root" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          plist_path, marker_path, smoke_root = map(Path, sys.argv[1:])
          label = f"org.zenoforge.unitgen.load.{smoke_root.name}"
          with plist_path.open("wb") as output:
              plistlib.dump(
                  {
                      "Label": label,
                      "ProgramArguments": ["/usr/bin/touch", str(marker_path)],
                      "RunAtLoad": True,
                  },
                  output,
              )
          PY
          printf '%s\n' "$(basename "$plist")" > "$launchagents_dir/.unitgen.changed"
          ZF_TIMERS=launchd python3 engine/unitgen.py load --launchagents-dir "$launchagents_dir" --uid "$uid"
          deadline=$((SECONDS + 20))
          while [[ ! -e "$marker" ]] && (( SECONDS < deadline )); do
            sleep 0.1
          done
          [[ -e "$marker" ]] || { echo 'FAIL: launchd did not touch the marker file' >&2; exit 1; }
          echo 'PASS unitgen load launchd smoke'

  portable-shim-contract-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable-shim contract test
        env:
          ZF_RUNNER: pidfile
        run: bash engine/portable-shim/zf_units.test.sh
