name: engine-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# main: one run plus the newest waiting, so a merge burst still gets a verdict. PRs: the latest push wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # Installs exactly the lockfile, which includes @typesafe-ai/sdk (engine/ts-judge.mjs's only npm runtime dependency).
      - run: npm ci
      - run: bash tools/run-engine-tests.sh ${{ matrix.shard }} 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.shard }}
          path: |
            engine-test-failures-${{ matrix.shard }}.txt
            test-logs/
