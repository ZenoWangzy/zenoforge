name: public-text

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test public-text guard
        run: node --test engine/public-text-guard.test.mjs
      - name: Fetch PR head as data
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          git cat-file -e "$HEAD_SHA^{commit}"
      - name: Check public text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZF_PUBLIC_TEXT_DENYLIST: ${{ secrets.ZF_PUBLIC_TEXT_DENYLIST }}
        run: node engine/public-text-guard.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
