<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">Zenoforge</title>
  <desc id="d">Zenoforge, a self-hosted software factory: GitHub issues flow into a glowing forge and come out as merged pull requests.</desc>
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d1a"/>
      <stop offset="0.55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <linearGradient id="emberH" gradientUnits="userSpaceOnUse" x1="680" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#ff4d1a"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1218"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="1030" cy="240" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a1f" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ff6a1f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="plate"><rect width="1280" height="480" rx="28"/></clipPath>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:10 14;animation:flow 1.6s linear infinite}
    .spin{transform-origin:1030px 240px;transform-box:view-box;animation:spin 40s linear infinite}
    .spark{animation:rise 3.6s ease-out infinite;opacity:0}
    @keyframes flow{to{stroke-dashoffset:-48}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rise{0%{opacity:0;transform:translateY(18px)}20%{opacity:.95}100%{opacity:0;transform:translateY(-70px)}}
    @media (prefers-reduced-motion:reduce){.flow,.spin,.spark{animation:none}.spark{opacity:.6}}
  </style>

  <g clip-path="url(#plate)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#dots)"/>
    <rect width="1280" height="480" fill="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="118" class="sans" font-size="22" font-weight="700" letter-spacing="3.5" fill="#ff8a1f">SELF-HOSTED SOFTWARE FACTORY</text>
  <text x="68" y="236" class="sans" font-size="112" font-weight="800" letter-spacing="-3" fill="#f4f6fa">Zeno<tspan fill="url(#word)">forge</tspan></text>
  <text x="72" y="312" class="sans" font-size="40" font-weight="600" fill="#f4f6fa">Your GitHub issues,</text>
  <text x="72" y="362" class="sans" font-size="40" font-weight="600" fill="#f4f6fa">shipped by coding agents.</text>
  <text x="72" y="424" class="mono" font-size="24" fill="#9aa4b5">codex · claude · zcode  <tspan fill="#ff8a1f">&#8594;</tspan>  merged PRs</text>

  <!-- forge motif -->
  <g>
    <g class="spin" fill="none">
      <circle cx="1030" cy="240" r="150" stroke="#ff8a1f" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round"/>
      <circle cx="1030" cy="240" r="190" stroke="#ff8a1f" stroke-opacity="0.18" stroke-width="2"/>
    </g>

    <!-- inputs -->
    <g fill="none" stroke="url(#emberH)" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path class="flow" d="M756 120 C 870 120, 880 240, 944 240"/>
      <path class="flow" d="M706 240 L 944 240"/>
      <path class="flow" d="M756 360 C 870 360, 880 240, 944 240"/>
    </g>
    <g fill="#141a23" stroke="#3a4354" stroke-width="2">
      <rect x="726" y="106" width="30" height="30" rx="8"/>
      <rect x="676" y="226" width="30" height="30" rx="8"/>
      <rect x="726" y="346" width="30" height="30" rx="8"/>
    </g>
    <g fill="#ff8a1f">
      <circle cx="741" cy="121" r="5"/><circle cx="691" cy="241" r="5"/><circle cx="741" cy="361" r="5"/>
    </g>

    <!-- core -->
    <polygon points="1030,148 1110,194 1110,286 1030,332 950,286 950,194" fill="url(#ember)"/>
    <polygon points="1030,168 1093,204 1093,276 1030,312 967,276 967,204" fill="#0c1017"/>
    <polygon points="1030,168 1093,204 1093,276 1030,312 967,276 967,204" fill="none" stroke="#ffb24a" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M1000 212 H1060 L1000 268 H1062" fill="none" stroke="url(#ember)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- output -->
    <path class="flow" d="M1112 240 L 1186 240" fill="none" stroke="url(#emberH)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1220" cy="240" r="28" fill="#0f2a20" stroke="#3ddc97" stroke-width="3"/>
    <path d="M1207 241 L1217 251 L1234 230" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- sparks -->
    <g fill="#ffb24a">
      <circle class="spark" cx="1004" cy="146" r="3.5" style="animation-delay:0s"/>
      <circle class="spark" cx="1050" cy="138" r="2.5" style="animation-delay:.9s"/>
      <circle class="spark" cx="1080" cy="150" r="3" style="animation-delay:1.8s"/>
      <circle class="spark" cx="1026" cy="130" r="2" style="animation-delay:2.6s"/>
      <circle class="spark" cx="985" cy="158" r="2.5" style="animation-delay:1.3s"/>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="478" rx="27" fill="none" stroke="#2a3140" stroke-width="2"/>
</svg>
